<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DUMO × RVEA 經營帳本</title>
<style>
:root{
  --paper:#FAF8F4;
  --paper-line: rgba(28,27,31,0.045);
  --ink:#1C1B1F;
  --ink-soft:#6B6B70;
  --ink-faint:#9C9A96;
  --line:#E4E0D8;
  --line-strong:#D3CDC0;
  --navy:#14213D;
  --navy-soft:#1D2C4F;
  --navy-line: rgba(255,255,255,0.09);
  --dumo:#A8506B;
  --dumo-deep:#7E3850;
  --dumo-soft:#F5E4E9;
  --rvea:#1F6F5C;
  --rvea-deep:#154F41;
  --rvea-soft:#E1EFEA;
  --shared:#A3813E;
  --shared-soft:#F3EAD4;
  --pos:#2E7D5B;
  --neg:#B23A32;
  --card-bg:#FFFFFF;
  --radius:10px;
  --radius-sm:6px;
  --font-display: "Noto Serif TC","Source Serif 4",Georgia,"Times New Roman",serif;
  --font-body: "PingFang TC","Microsoft JhengHei","Noto Sans TC","Helvetica Neue",Arial,sans-serif;
  --font-mono: "SF Mono","Cascadia Mono","Consolas","PingFang TC",monospace;
  --shadow-card: 0 1px 2px rgba(28,27,31,0.04), 0 1px 12px rgba(28,27,31,0.05);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font-body);
  background:var(--paper);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  font-size:14px;
  line-height:1.5;
}
button{font-family:inherit;}
input,select,textarea{font-family:inherit;font-size:13.5px;}
.num{ font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; }
::selection{ background: var(--dumo-soft); }

/* ---------- App shell ---------- */
#app{ display:flex; min-height:100vh; }

.sidebar{
  width:236px; flex-shrink:0;
  background: linear-gradient(180deg, var(--navy) 0%, #101a33 100%);
  color:#fff;
  padding:24px 16px;
  display:flex; flex-direction:column;
  position:sticky; top:0; height:100vh;
}
.brand-mark{
  padding:0 8px 20px 8px;
  border-bottom:1px solid var(--navy-line);
  margin-bottom:18px;
}
.brand-mark .title{
  font-family:var(--font-display);
  font-size:19px; letter-spacing:0.5px; font-weight:600;
  display:flex; align-items:center; gap:6px;
}
.brand-mark .dot-dumo, .brand-mark .dot-rvea{
  width:8px;height:8px;border-radius:50%;display:inline-block;
}
.brand-mark .dot-dumo{ background:var(--dumo); }
.brand-mark .dot-rvea{ background:var(--rvea); }
.brand-mark .sub{
  font-size:11px; color:rgba(255,255,255,0.5); margin-top:5px; letter-spacing:1.5px; text-transform:uppercase;
}
.nav{ display:flex; flex-direction:column; gap:2px; }
.nav-item{
  display:flex; align-items:center; gap:10px;
  padding:10px 12px; border-radius:8px; cursor:pointer;
  color:rgba(255,255,255,0.72); font-size:13.5px;
  transition: background .15s, color .15s;
  user-select:none;
}
.nav-item svg{ width:16px;height:16px; opacity:0.85; flex-shrink:0; }
.nav-item:hover{ background:rgba(255,255,255,0.06); color:#fff; }
.nav-item.active{ background:rgba(255,255,255,0.12); color:#fff; font-weight:600; }
.nav-section-label{
  font-size:10.5px; color:rgba(255,255,255,0.38); letter-spacing:1.5px; text-transform:uppercase;
  margin:16px 12px 6px 12px;
}
.sidebar-foot{
  margin-top:auto; padding-top:14px; border-top:1px solid var(--navy-line);
  font-size:11px; color:rgba(255,255,255,0.4); padding-left:12px; line-height:1.6;
}

.main{ flex:1; min-width:0; padding:28px 36px 60px 36px; }
.page{ display:none; max-width:1180px; margin:0 auto; }
.page.active{ display:block; }

.page-head{ display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:22px; flex-wrap:wrap; gap:12px; }
.page-title{ font-family:var(--font-display); font-size:26px; font-weight:600; letter-spacing:0.2px; }
.page-sub{ color:var(--ink-soft); font-size:13px; margin-top:4px; }

/* ---------- view toggle (帳面/實收) ---------- */
.view-toggle{
  display:inline-flex; background:#EFEBE2; border-radius:999px; padding:3px; gap:2px;
}
.view-toggle button{
  border:none; background:transparent; padding:7px 16px; border-radius:999px;
  font-size:13px; color:var(--ink-soft); cursor:pointer; font-weight:500;
  transition: all .15s;
}
.view-toggle button.active{ background:var(--navy); color:#fff; }

/* ---------- cards ---------- */
.card-row{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:22px; }
.stat-card{
  background:var(--card-bg); border:1px solid var(--line); border-radius:var(--radius);
  padding:18px 20px; box-shadow:var(--shadow-card); position:relative; overflow:hidden;
}
.stat-card::before{
  content:""; position:absolute; inset:0; opacity:0.55; pointer-events:none;
  background-image: repeating-linear-gradient(0deg, var(--paper-line) 0px, var(--paper-line) 1px, transparent 1px, transparent 22px);
}
.stat-card .label{ font-size:12px; color:var(--ink-soft); letter-spacing:0.3px; position:relative; }
.stat-card .value{ font-family:var(--font-mono); font-size:26px; font-weight:600; margin-top:6px; position:relative; }
.stat-card .value.pos{ color:var(--pos); }
.stat-card .value.neg{ color:var(--neg); }
.stat-card .foot{ font-size:11.5px; color:var(--ink-faint); margin-top:4px; position:relative; }

.panel{
  background:var(--card-bg); border:1px solid var(--line); border-radius:var(--radius);
  box-shadow:var(--shadow-card); margin-bottom:20px; overflow:hidden;
}
.panel-head{
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 18px; border-bottom:1px solid var(--line);
}
.panel-head h3{ margin:0; font-size:14.5px; font-weight:600; font-family:var(--font-display); }
.panel-body{ padding:16px 18px; }

/* ---------- tables ---------- */
table.ledger{ width:100%; border-collapse:collapse; font-size:13px; }
table.ledger th{
  text-align:right; font-weight:600; color:var(--ink-soft); font-size:11.5px;
  letter-spacing:0.2px; padding:8px 10px; border-bottom:1.5px solid var(--line-strong);
  white-space:nowrap;
}
table.ledger th:first-child, table.ledger td:first-child{ text-align:left; }
table.ledger td{ padding:8px 10px; border-bottom:1px solid var(--line); text-align:right; white-space:nowrap; }
table.ledger tbody tr:hover{ background: rgba(28,27,31,0.02); }
table.ledger tfoot td{ font-weight:700; border-top:1.5px solid var(--line-strong); border-bottom:none; }
.brand-chip{
  display:inline-flex; align-items:center; gap:5px; font-size:11.5px; padding:2px 8px 2px 6px;
  border-radius:999px; font-weight:600; white-space:nowrap;
}
.brand-chip .dot{ width:6px;height:6px;border-radius:50%; }
.brand-chip.dumo{ background:var(--dumo-soft); color:var(--dumo-deep); }
.brand-chip.dumo .dot{ background:var(--dumo); }
.brand-chip.rvea{ background:var(--rvea-soft); color:var(--rvea-deep); }
.brand-chip.rvea .dot{ background:var(--rvea); }
.brand-chip.shared{ background:var(--shared-soft); color:#7A5E24; }
.brand-chip.shared .dot{ background:var(--shared); }

/* ---------- chart ---------- */
.chart-wrap{ padding:18px 18px 8px 18px; }
.bars{ display:flex; align-items:flex-end; gap:10px; height:180px; padding-top:10px; }
.bar-col{ flex:1; display:flex; flex-direction:column; align-items:center; height:100%; justify-content:flex-end; }
.bar-stack{ width:100%; max-width:34px; display:flex; flex-direction:column-reverse; border-radius:3px 3px 0 0; overflow:hidden; }
.bar-seg-dumo{ background:var(--dumo); }
.bar-seg-rvea{ background:var(--rvea); }
.bar-profit{ font-family:var(--font-mono); font-size:10.5px; margin-top:6px; white-space:nowrap; }
.bar-month{ font-size:11px; color:var(--ink-soft); margin-top:4px; }
.chart-legend{ display:flex; gap:16px; padding:0 18px 14px 18px; font-size:11.5px; color:var(--ink-soft); }
.chart-legend span{ display:inline-flex; align-items:center; gap:5px; }
.chart-legend .dot{ width:8px;height:8px;border-radius:50%; }

/* ---------- forms ---------- */
.field-row{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:12px; }
.field{ display:flex; flex-direction:column; gap:5px; }
.field.full{ grid-column:1 / -1; }
.field label{ font-size:12px; color:var(--ink-soft); font-weight:600; }
.field input, .field select, .field textarea{
  border:1px solid var(--line-strong); border-radius:var(--radius-sm); padding:8px 10px; background:#fff; color:var(--ink);
}
.field input:focus, .field select:focus, .field textarea:focus{ outline:2px solid var(--navy); outline-offset:0; border-color:var(--navy); }
.field .hint{ font-size:11px; color:var(--ink-faint); }
.btn{
  border:none; border-radius:var(--radius-sm); padding:9px 16px; font-size:13px; font-weight:600; cursor:pointer;
  transition: filter .15s, transform .05s;
}
.btn:active{ transform: translateY(1px); }
.btn-primary{ background:var(--navy); color:#fff; }
.btn-primary:hover{ filter:brightness(1.15); }
.btn-ghost{ background:transparent; color:var(--ink-soft); border:1px solid var(--line-strong); }
.btn-ghost:hover{ background:#F1EDE4; }
.btn-danger{ background:transparent; color:var(--neg); border:1px solid rgba(178,58,50,0.35); }
.btn-danger:hover{ background:rgba(178,58,50,0.06); }
.btn-sm{ padding:5px 10px; font-size:12px; border-radius:6px; }
.icon-btn{ background:none; border:none; cursor:pointer; color:var(--ink-faint); padding:4px; border-radius:5px; }
.icon-btn:hover{ background:#F1EDE4; color:var(--ink); }

.toolbar{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:14px; }
.toolbar select, .toolbar input{
  border:1px solid var(--line-strong); border-radius:var(--radius-sm); padding:7px 10px; font-size:12.5px; background:#fff;
}
.spacer{ flex:1; }

/* ---------- modal ---------- */
.modal-backdrop{
  display:none; position:fixed; inset:0; background:rgba(20,33,61,0.45); z-index:100;
  align-items:flex-start; justify-content:center; padding:40px 16px; overflow-y:auto;
}
.modal-backdrop.open{ display:flex; }
.modal{
  background:#fff; border-radius:14px; width:100%; max-width:560px; box-shadow:0 20px 60px rgba(0,0,0,0.25);
  animation: modalIn .16s ease-out;
}
@keyframes modalIn{ from{ opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }
.modal-head{ display:flex; align-items:center; justify-content:space-between; padding:18px 20px; border-bottom:1px solid var(--line); }
.modal-head h3{ margin:0; font-family:var(--font-display); font-size:17px; }
.modal-body{ padding:18px 20px; max-height:70vh; overflow-y:auto; }
.modal-foot{ display:flex; justify-content:flex-end; gap:8px; padding:14px 20px; border-top:1px solid var(--line); }

.type-toggle{ display:flex; gap:8px; margin-bottom:14px; }
.type-toggle button{
  flex:1; padding:9px; border-radius:var(--radius-sm); border:1.5px solid var(--line-strong); background:#fff;
  font-weight:600; cursor:pointer; color:var(--ink-soft);
}
.type-toggle button.active.rev{ background:var(--rvea-soft); border-color:var(--rvea); color:var(--rvea-deep); }
.type-toggle button.active.exp{ background:var(--dumo-soft); border-color:var(--dumo); color:var(--dumo-deep); }

.banner{
  border-radius:var(--radius-sm); padding:10px 14px; font-size:12.5px; margin-bottom:14px; line-height:1.6;
}
.banner.info{ background:#EEF3FB; color:#2C4470; border:1px solid #D3E0F3; }
.banner.warn{ background:#FBF3E4; color:#7A5E24; border:1px solid #EFDDB0; }
.banner.error{ background:#FBE9E7; color:#8A2E26; border:1px solid #F0C4BE; }

.empty{ text-align:center; padding:40px 20px; color:var(--ink-faint); font-size:13px; }

.sublinetabs{ display:flex; gap:4px; margin-bottom:18px; border-bottom:1px solid var(--line); }
.sublinetabs button{
  border:none; background:none; padding:9px 14px; font-size:13px; color:var(--ink-soft); cursor:pointer;
  border-bottom:2px solid transparent; font-weight:500; margin-bottom:-1px;
}
.sublinetabs button.active{ color:var(--ink); border-bottom-color:var(--navy); font-weight:700; }

/* receipt page */
.dropzone{
  border:1.5px dashed var(--line-strong); border-radius:var(--radius); padding:34px; text-align:center; cursor:pointer;
  color:var(--ink-soft); background:#fff; transition: border-color .15s, background .15s;
}
.dropzone:hover{ border-color:var(--navy); background:#F6F5F1; }
.dropzone.hasimg{ padding:14px; }
.receipt-preview{ max-width:100%; max-height:320px; border-radius:8px; display:block; margin:0 auto; }

.spinner{
  width:15px;height:15px;border:2px solid rgba(255,255,255,0.4); border-top-color:#fff; border-radius:50%;
  display:inline-block; animation: spin .7s linear infinite; vertical-align:-2px; margin-right:6px;
}
@keyframes spin{ to{ transform:rotate(360deg); } }

.mobile-topbar{ display:none; }

@media (max-width: 860px){
  html{ font-size:15px; }
  body{ font-size:13px; }

  .mobile-topbar{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--navy); color:#fff; padding:11px 12px;
    position:sticky; top:0; z-index:60;
  }
  .mobile-topbar .title{
    font-family:var(--font-display); font-size:14.5px; font-weight:600;
    display:flex; align-items:center; gap:5px;
  }
  .mobile-topbar .dot-dumo, .mobile-topbar .dot-rvea{ width:6px;height:6px;border-radius:50%;display:inline-block; }
  .mobile-topbar .dot-dumo{ background:var(--dumo); }
  .mobile-topbar .dot-rvea{ background:var(--rvea); }
  .hamburger{ background:none;border:none;color:#fff;padding:6px;cursor:pointer;flex-shrink:0; }
  .hamburger svg{ width:21px;height:21px; }

  #app{ display:block; }
  .sidebar{
    display:flex !important;
    position:fixed; top:0; left:0; height:100dvh; width:76vw; max-width:280px;
    transform: translateX(-105%); transition: transform .2s ease-out;
    z-index:110; box-shadow: 6px 0 28px rgba(0,0,0,0.28);
  }
  .sidebar.open{ transform: translateX(0); }
  .sidebar-backdrop{
    display:none; position:fixed; inset:0; background:rgba(15,20,35,0.45); z-index:100;
  }
  .sidebar-backdrop.open{ display:block; }

  .main{ padding:14px 12px 70px 12px; }

  .page-title{ font-size:19px; }
  .page-sub{ font-size:11.5px; }
  .page-head{ margin-bottom:16px; gap:10px; }

  .card-row{ grid-template-columns:1fr 1fr; gap:8px; margin-bottom:16px; }
  .stat-card{ padding:12px 13px; }
  .stat-card .label{ font-size:10.5px; }
  .stat-card .value{ font-size:18px; margin-top:4px; }
  .stat-card .foot{ font-size:10px; }

  .panel{ margin-bottom:14px; border-radius:8px; }
  .panel-head{ padding:11px 13px; flex-wrap:wrap; gap:8px; }
  .panel-head h3{ font-size:13px; }
  .panel-body{ padding:12px 13px; overflow-x:auto; -webkit-overflow-scrolling:touch; }

  table.ledger{ font-size:11.5px; min-width:560px; }
  table.ledger th{ padding:6px 7px; font-size:10.5px; }
  table.ledger td{ padding:6px 7px; }
  .brand-chip{ font-size:10.5px; padding:2px 7px 2px 5px; }

  .view-toggle button{ padding:6px 12px; font-size:11.5px; }

  .chart-wrap{ overflow-x:auto; -webkit-overflow-scrolling:touch; padding:14px 13px 6px 13px; }
  .bars{ min-width:480px; height:150px; }
  .chart-legend{ padding:0 13px 12px 13px; font-size:10.5px; }

  .field-row{ grid-template-columns:1fr; gap:10px; }
  .field label{ font-size:11.5px; }
  .field input, .field select, .field textarea{ padding:9px 10px; font-size:14px; } /* 14px avoids iOS zoom-on-focus */

  .toolbar{ gap:6px; }
  .toolbar select, .toolbar input{ font-size:12.5px; padding:8px 9px; flex:1 1 auto; min-width:110px; }

  .sublinetabs{ overflow-x:auto; -webkit-overflow-scrolling:touch; flex-wrap:nowrap; }
  .sublinetabs button{ padding:9px 12px; font-size:12.5px; white-space:nowrap; }

  .btn{ padding:10px 15px; font-size:13px; }
  .btn-sm{ padding:7px 11px; font-size:12px; }
  .icon-btn{ padding:8px; }

  .modal-backdrop{ padding:0; align-items:flex-end; }
  .modal{ max-width:100%; width:100%; border-radius:16px 16px 0 0; max-height:90dvh; }
  .modal-body{ max-height:calc(90dvh - 128px); padding:16px; }
  .modal-head{ padding:16px 16px 14px 16px; }
  .modal-foot{ padding:12px 16px 16px 16px; }

  .dropzone{ padding:24px 16px; }
  .empty{ padding:26px 14px; font-size:12px; }
  .banner{ font-size:12px; padding:9px 12px; }
}
</style>
</head>
<body>

<div id="storageWarning" style="display:none; align-items:center; gap:10px; background:#7A2E26; color:#fff; padding:10px 16px; font-size:12.5px; line-height:1.5; position:sticky; top:0; z-index:200;">
  <span>⚠️ 目前雲端儲存無法使用，剛剛的記錄可能不會保留到下次打開。請確認是從 Claude 對話裡的連結／預覽開啟這個頁面，而不是把檔案下載後單獨開啟。建議先按左側選單的「匯出備份」把資料存下來。</span>
</div>
<div class="mobile-topbar" id="mobileTopbar">
  <button class="hamburger" id="hamburgerBtn" aria-label="選單">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
  <div class="title"><span class="dot-dumo"></span>DUMO<span style="opacity:.5;">×</span><span class="dot-rvea"></span>RVEA</div>
  <div style="width:34px;"></div>
</div>
<div class="sidebar-backdrop" id="sidebarBackdrop"></div>

<div id="app">
  <div class="sidebar" id="sidebar">
    <div class="brand-mark">
      <div class="title"><span class="dot-dumo"></span>DUMO<span style="opacity:.4;font-weight:400;">×</span><span class="dot-rvea"></span>RVEA</div>
      <div class="sub">經營帳本 · Ledger</div>
    </div>
    <div class="nav" id="nav"></div>
    <div class="sidebar-foot">
      <div id="storageModeLine">資料儲存狀態：檢查中…</div>
      依訂單日期(帳面)與入帳日期(實收)雙軌記帳
      <div style="display:flex; gap:6px; margin-top:12px;">
        <button id="btnExportBackup" style="flex:1; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.15); color:rgba(255,255,255,0.85); border-radius:6px; padding:7px 6px; font-size:11px; cursor:pointer;">匯出備份</button>
        <button id="btnImportBackup" style="flex:1; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.15); color:rgba(255,255,255,0.85); border-radius:6px; padding:7px 6px; font-size:11px; cursor:pointer;">匯入備份</button>
      </div>
      <input type="file" id="backupFileInput" accept="application/json" style="display:none;">
    </div>
  </div>

  <div class="main" id="main"></div>
</div>

<div class="modal-backdrop" id="modalBackdrop">

// ---- Google Sheet backend (matches the 脈動 Pulse app pattern) ----
// Paste your deployed Apps Script Web App URL here to make this a fully
// standalone app (works from a home-screen bookmark, independent of Claude).
// Leave as-is to keep using Claude's built-in cloud storage instead.
const SHEET_API_URL = "https://script.google.com/macros/s/AKfycbzNuS_gfWXUvBY22feVcRRe7ucA2-3et5N2i9x9_-Yo8cUun7TFfDFtmzEYefdsT95G/exec";

function cloudConfigured(){
  return typeof SHEET_API_URL === 'string' && SHEET_API_URL.indexOf('https://script.google.com/') === 0;
}

async function cloudFetch(method, body){
  const opts = { method };
  if(body){
    // text/plain avoids a CORS preflight against the Apps Script endpoint
    opts.headers = { 'Content-Type': 'text/plain;charset=utf-8' };
    opts.body = JSON.stringify(body);
  }
  let lastErr;
  for(let i=0;i<3;i++){
    try{
      const url = method==='GET' ? (SHEET_API_URL + '?action=all&_t=' + Date.now()) : SHEET_API_URL;
      const resp = await fetch(url, opts);
      const data = await resp.json();
      if(!data || data.ok===false) throw new Error((data && data.error) || '試算表回應異常');
      return data;
    }catch(e){
      lastErr = e;
      if(i<2) await new Promise(r=>setTimeout(r, 700*(i+1)));
    }
  }
  throw lastErr;
}
async function cloudLoadAll(){ return cloudFetch('GET'); }
async function cloudReplaceAll(){
  return cloudFetch('POST', { action:'replaceAll', txns: TXNS, cashlogs: CASHLOGS, settings: SETTINGS });
}

/* ---------------- persistence ---------------- */
function storageAvailable(){
  return typeof window.storage === 'object' && window.storage
    && typeof window.storage.get === 'function' && typeof window.storage.set === 'function';
}

async function loadData(){
  if(cloudConfigured()){
    STORAGE_MODE = 'sheet';
    try{
      const data = await cloudLoadAll();
      TXNS = Array.isArray(data.txns) ? data.txns : [];
      CASHLOGS = Array.isArray(data.cashlogs) ? data.cashlogs : [];
      if(data.settings) SETTINGS = Object.assign(SETTINGS, data.settings);
      if(TXNS.length===0 && CASHLOGS.length===0 && (window.SEED_TXNS||[]).length){
        // first-time connection to a fresh sheet: seed with historical data once
        TXNS = window.SEED_TXNS.map(t=>({...t}));
        await cloudReplaceAll();
      }
      STORAGE_OK = true;
      return;
    }catch(e){
      console.error('sheet load failed', e);
      STORAGE_OK = false;
      TXNS = (window.SEED_TXNS || []).map(t=>({...t}));
      CASHLOGS = [];
      return;
    }
  }

  // Fallback: Claude's built-in artifact cloud storage (only works when opened within a Claude conversation)
  STORAGE_MODE = 'claude-storage';
  if(!storageAvailable()){
    STORAGE_MODE = 'none';
    STORAGE_OK = false;
    TXNS = (window.SEED_TXNS || []).map(t=>({...t}));
    CASHLOGS = [];
    return;
  }
  try{
    const r = await window.storage.get('txns');
    TXNS = JSON.parse(r.value);
  }catch(e){
    TXNS = (window.SEED_TXNS || []).map(t=>({...t}));
    await saveTxns();
  }
  try{
    const r = await window.storage.get('cashlogs');
    CASHLOGS = JSON.parse(r.value);
  }catch(e){
    CASHLOGS = [];
    await saveCashlogs();
  }
  try{
    const r = await window.storage.get('settings');
    SETTINGS = Object.assign(SETTINGS, JSON.parse(r.value));
  }catch(e){
    await saveSettings();
  }
}

async function saveTxns(){
  if(STORAGE_MODE==='sheet'){
    try{ await cloudReplaceAll(); STORAGE_OK = true; }
    catch(e){ console.error('sheet save failed', e); STORAGE_OK = false; showStorageWarning(); }
    return;
  }
  if(!storageAvailable()){ STORAGE_OK = false; showStorageWarning(); return; }
  try{ const r = await window.storage.set('txns', JSON.stringify(TXNS)); if(!r) throw new Error('no result'); STORAGE_OK = true; }
  catch(e){ console.error('save txns failed', e); STORAGE_OK = false; showStorageWarning(); }
}
async function saveCashlogs(){
  if(STORAGE_MODE==='sheet'){
    try{ await cloudReplaceAll(); STORAGE_OK = true; }
    catch(e){ console.error('sheet save failed', e); STORAGE_OK = false; showStorageWarning(); }
    return;
  }
  if(!storageAvailable()){ STORAGE_OK = false; showStorageWarning(); return; }
  try{ const r = await window.storage.set('cashlogs', JSON.stringify(CASHLOGS)); if(!r) throw new Error('no result'); STORAGE_OK = true; }
  catch(e){ console.error('save cashlogs failed', e); STORAGE_OK = false; showStorageWarning(); }
}
async function saveSettings(){
  if(STORAGE_MODE==='sheet'){
    try{ await cloudReplaceAll(); STORAGE_OK = true; }
    catch(e){ console.error('sheet save failed', e); STORAGE_OK = false; }
    return;
  }
  if(!storageAvailable()){ STORAGE_OK = false; return; }
  try{ const r = await window.storage.set('settings', JSON.stringify(SETTINGS)); if(!r) throw new Error('no result'); STORAGE_OK = true; }
  catch(e){ console.error('save settings failed', e); STORAGE_OK = false; }
}

function showStorageWarning(){
  const el = document.getElementById('storageWarning');
  if(el){
    if(STORAGE_MODE==='sheet'){
      el.querySelector('span').textContent = '⚠️ 目前連不上 Google 試算表，剛剛的記錄可能沒有存進去。請檢查網路連線，或確認 Apps Script 網址還有效；資料暫時只留在這個畫面上，建議先按「匯出備份」保存。';
    }
    el.style.display = 'flex';
  }
}

/* ---------------- manual backup (export / import) ----------------
   Safety net independent of cloud auto-save: lets Laina download a
   JSON snapshot at any time and restore it later on any device. */
function exportBackup(){
  const payload = { txns: TXNS, cashlogs: CASHLOGS, settings: SETTINGS, exportedAt: new Date().toISOString() };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = todayStr();
  a.href = url;
  a.download = `DUMO-RVEA-記帳備份-${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}

async function importBackupFile(file){
  const text = await file.text();
  let payload;
  try{ payload = JSON.parse(text); }catch(e){ alert('這個檔案不是有效的備份檔（JSON格式錯誤）'); return; }
  if(!payload || !Array.isArray(payload.txns)){ alert('這個檔案看起來不是本系統的備份檔'); return; }
  const n = payload.txns.length + (Array.isArray(payload.cashlogs)?payload.cashlogs.length:0);
  if(!confirm(`即將匯入備份檔（共 ${n} 筆資料），會覆蓋目前畫面上的所有記錄，確定要繼續嗎？`)) return;
  TXNS = payload.txns;
  CASHLOGS = Array.isArray(payload.cashlogs) ? payload.cashlogs : [];
  if(payload.settings) SETTINGS = Object.assign(SETTINGS, payload.settings);
  await saveTxns();
  await saveCashlogs();
  await saveSettings();
  alert(STORAGE_OK ? '匯入完成，資料已同步到雲端儲存。' : '匯入完成，但目前雲端儲存無法使用，請記得再次匯出備份保存。');
  renderApp();
}

function todayStr(){

/* ============================================================
   Core calculation engine
   ============================================================ */

// Sum revenue for brand (+ optional productLine) in a given month, by view mode
function revenueFor(brand, month, mode, productLine){
  mode = mode || VIEW_MODE;
  if(mode === 'accrual'){
    return TXNS.filter(t=>{
      if(t.type!=='revenue') return false;
      if(monthKey(t.date)!==month) return false;
      if(t.brand!==brand) return false;
      if(productLine && t.productLine!==productLine) return false;
      return true;
    }).reduce((s,t)=>s+t.twd,0);
  } else {
    // cash: use cashlogs dated in this month
    return CASHLOGS.filter(c=>{
      if(monthKey(c.date)!==month) return false;
      if(c.brand!==brand) return false;
      if(productLine && c.productLine!==productLine) return false;
      return true;
    }).reduce((s,c)=>s+c.amountTWD,0);
  }
}

// Direct (non-shared) expense for a brand in a month. brand: 'DUMO'|'RVEA'. Optional productLine filters RVEA sub.
function directExpenseFor(brand, month, productLine){
  return TXNS.filter(t=>{
    if(t.type!=='expense') return false;
    if(monthKey(t.date)!==month) return false;
    if(t.brand!==brand) return false;
    if(productLine !== undefined){
      if(productLine===null){ if(t.productLine) return false; }
      else if(t.productLine!==productLine) return false;
    }
    return true;
  }).reduce((s,t)=>s+t.twd,0);
}

function sharedExpenseFor(month){
  return TXNS.filter(t=> t.type==='expense' && t.brand==='SHARED' && monthKey(t.date)===month)
    .reduce((s,t)=>s+t.twd,0);
}

// Full month computation for both brands, returns object with allocation applied
function computeMonth(month, mode){
  mode = mode || VIEW_MODE;
  const dumoRevAccrual = revenueFor('DUMO', month, 'accrual');
  const rveaRevAccrual = revenueFor('RVEA', month, 'accrual');
  const dumoRev = revenueFor('DUMO', month, mode);
  const rveaRev = revenueFor('RVEA', month, mode);
  const totalRevAccrual = dumoRevAccrual + rveaRevAccrual;

  const shared = sharedExpenseFor(month);
  let dumoShare, rveaShare;
  if(totalRevAccrual > 0){
    dumoShare = shared * (dumoRevAccrual/totalRevAccrual);
    rveaShare = shared * (rveaRevAccrual/totalRevAccrual);
  } else {
    dumoShare = shared/2; rveaShare = shared/2;
  }
  const dumoDirect = directExpenseFor('DUMO', month);
  const rveaDirect = directExpenseFor('RVEA', month);
  const dumoCost = dumoDirect + dumoShare;
  const rveaCost = rveaDirect + rveaShare;

  return {
    month,
    dumoRev, rveaRev, totalRev: dumoRev+rveaRev,
    dumoDirect, rveaDirect, shared, dumoShare, rveaShare,
    dumoCost, rveaCost, totalCost: dumoCost+rveaCost,
    dumoProfit: dumoRev-dumoCost, rveaProfit: rveaRev-rveaCost,
    totalProfit: (dumoRev+rveaRev)-(dumoCost+rveaCost)
  };
}

function yearMonths(){
  const y = currentYear();
  return MONTHS.map(m=>y+'-'+m);
}

function computeYear(mode){
  return yearMonths().map(m=>computeMonth(m, mode));
}

// RVEA product-line cost allocation within a month
function computeRveaLines(month, mode){
  mode = mode || VIEW_MODE;
  const rveaRevAccrual = revenueFor('RVEA', month, 'accrual');
  const m = computeMonth(month, mode); // gives rveaCost total (direct + allocated shared)
  const rveaCommonDirect = directExpenseFor('RVEA', month, null); // RVEA expense with no productLine tag
  const linesTaggedDirect = {};
  let taggedTotal = 0;
  PRODUCT_LINES.forEach(pl=>{
    const v = directExpenseFor('RVEA', month, pl);
    linesTaggedDirect[pl] = v; taggedTotal += v;
  });
  const commonPool = m.rveaCost - taggedTotal; // rveaShare(shared) + rveaCommonDirect
  const revByLine = {};
  let revSum = 0;
  PRODUCT_LINES.forEach(pl=>{
    const v = revenueFor('RVEA', month, mode, pl);
    revByLine[pl] = v; revSum += v;
  });
  const out = {};
  PRODUCT_LINES.forEach(pl=>{
    let poolShare;
    if(rveaRevAccrual > 0){
      const revAccrualPl = revenueFor('RVEA', month, 'accrual', pl);
      poolShare = commonPool * (revAccrualPl/rveaRevAccrual);
    } else {
      poolShare = commonPool / PRODUCT_LINES.length;
    }
    const cost = linesTaggedDirect[pl] + poolShare;
    const rev = revByLine[pl];
    out[pl] = { revenue: rev, cost, profit: rev-cost };
  });
  return { lines: out, commonPool, rveaCommonDirect };
}

function renderBrandPage(brand){
  const accent = brand==='DUMO' ? 'dumo' : 'rvea';
  const rows = yearMonths().map(m=>computeMonth(m, VIEW_MODE));
  const ytdRev = rows.reduce((s,r)=>s+r[brand==='DUMO'?'dumoRev':'rveaRev'],0);
  const ytdCost = rows.reduce((s,r)=>s+r[brand==='DUMO'?'dumoCost':'rveaCost'],0);
  const ytdShare = rows.reduce((s,r)=>s+r[brand==='DUMO'?'dumoShare':'rveaShare'],0);
  const ytdDirect = rows.reduce((s,r)=>s+r[brand==='DUMO'?'dumoDirect':'rveaDirect'],0);
  const ytdProfit = ytdRev-ytdCost;

  // category breakdown (direct costs only, brand-specific)
  const catTotals = {};
  CATS.expense.forEach(c=>catTotals[c]=0);
  TXNS.filter(t=>t.type==='expense' && t.brand===brand && monthKey(t.date).slice(0,4)===currentYear())
    .forEach(t=>{ catTotals[t.category] = (catTotals[t.category]||0)+t.twd; });

  const tableRows = rows.map((r,i)=>{
    const rev = brand==='DUMO'?r.dumoRev:r.rveaRev;
    const direct = brand==='DUMO'?r.dumoDirect:r.rveaDirect;
    const share = brand==='DUMO'?r.dumoShare:r.rveaShare;
    const cost = brand==='DUMO'?r.dumoCost:r.rveaCost;
    const profit = rev-cost;
    if(rev===0 && cost===0) return `<tr style="opacity:.45"><td>${MONTH_LABEL[i]}</td><td class="num">–</td><td class="num">–</td><td class="num">–</td><td class="num">–</td><td class="num">–</td></tr>`;
    return `<tr>
      <td>${MONTH_LABEL[i]}</td>
      <td class="num">${fmtTWD(rev)}</td>
      <td class="num">${fmtTWD(direct)}</td>
      <td class="num">${fmtTWD(share)}</td>
      <td class="num" style="font-weight:600">${fmtTWD(cost)}</td>
      <td class="num" style="font-weight:700;color:${profit>=0?'var(--pos)':'var(--neg)'}">${fmtTWD(profit)}</td>

  }).join('');

  const catRows = CATS.expense.map(c=>{
    if(!catTotals[c]) return '';
    return `<tr><td>${c}</td><td class="num">${fmtTWD(catTotals[c])}</td></tr>`;
  }).join('');

  return `
  <div class="page active">
    <div class="page-head">
      <div>
        <div class="page-title"><span class="brand-chip ${accent}"><span class="dot"></span>${brand}</span></div>

      ${viewToggleHtml()}

    <div class="card-row">
      <div class="stat-card">
        <div class="label">年度至今營業額</div>
        <div class="value num">${fmtTWD(ytdRev)}</div>
      </div>
      <div class="stat-card">
        <div class="label">年度至今總支出</div>
        <div class="value num">${fmtTWD(ytdCost)}</div>
        <div class="foot">直接成本 ${fmtTWD(ytdDirect)} + 分攤共同成本 ${fmtTWD(ytdShare)}</div>

      <div class="stat-card">
        <div class="label">年度至今利潤</div>
        <div class="value num ${ytdProfit>=0?'pos':'neg'}">${fmtTWD(ytdProfit)}</div>

    <tr>

      <td style="text-align:left">${t.type==='revenue'?'<span style="color:var(--pos)">收入</span>':'<span style="color:var(--neg)">支出</span>'}</td>
      <td style="text-align:left">${escapeHtml(t.category)}</td>
      <td style="text-align:left">${escapeHtml(t.item)}${t.productLine?` <span style="color:var(--ink-faint)">· ${t.productLine}</span>`:''}</td>
      <td class="num">${fmtTWD(t.twd)}</td>
      <td style="text-align:center;white-space:nowrap;">
        <button class="icon-btn edit-txn" data-id="${t.id}" title="編輯">${iconEdit()}</button>
        <button class="icon-btn del-txn" data-id="${t.id}" title="刪除">${iconTrash()}</button>
      </td>

  return `<table class="ledger"><thead><tr><th>日期</th><th>類型</th><th>類別</th><th>項目</th><th>金額</th><th>操作</th></tr></thead><tbody>${rows}</tbody></table>
  ${list.length>=40?'<div style="text-align:center;color:var(--ink-faint);font-size:12px;padding:8px;">僅顯示最近 40 筆，完整清單請至「記帳總表」</div>':''}`;
}

  const ytdDirect = rows.reduce((s,r)=>s+r.rveaDirect,0);
  const ytdProfit = ytdRev-ytdCost;

  // revenue by product line for the year
  const lineRevYtd = {};
  PRODUCT_LINES.forEach(pl=>{
    lineRevYtd[pl] = yearMonths().reduce((s,m)=>s+revenueFor('RVEA', m, VIEW_MODE, pl),0);
  });

  const tableRows = rows.map((r,i)=>{
    if(r.rveaRev===0 && r.rveaCost===0) return `<tr style="opacity:.45"><td>${MONTH_LABEL[i]}</td><td class="num">–</td><td class="num">–</td><td class="num">–</td><td class="num">–</td><td class="num">–</td></tr>`;
    const profit = r.rveaRev-r.rveaCost;
    return `<tr>
      <td>${MONTH_LABEL[i]}</td>
      <td class="num">${fmtTWD(r.rveaRev)}</td>
      <td class="num">${fmtTWD(r.rveaDirect)}</td>
      <td class="num">${fmtTWD(r.rveaShare)}</td>

      <td class="num" style="font-weight:700;color:${profit>=0?'var(--pos)':'var(--neg)'}">${fmtTWD(profit)}</td>
    </tr>`;
  }).join('');

function renderRveaLinePage(line){
  const rows = yearMonths().map(m=>{

    return { month:m, revenue:r.revenue, cost:r.cost, profit:r.profit };
  });
  const ytdRev = rows.reduce((s,r)=>s+r.revenue,0);
  const ytdCost = rows.reduce((s,r)=>s+r.cost,0);
  const ytdProfit = ytdRev-ytdCost;

  const tableRows = rows.map((r,i)=>{
    if(r.revenue===0 && r.cost===0) return `<tr style="opacity:.45"><td>${MONTH_LABEL[i]}</td><td class="num">–</td><td class="num">–</td><td class="num">–</td></tr>`;
    return `<tr>
      <td>${MONTH_LABEL[i]}</td>
      <td class="num">${fmtTWD(r.revenue)}</td>
      <td class="num">${fmtTWD(r.cost)}</td>
      <td class="num" style="font-weight:700;color:${r.profit>=0?'var(--pos)':'var(--neg)'}">${fmtTWD(r.profit)}</td>
    </tr>`;
  }).join('');

  const lineTxns = TXNS.filter(t=>t.brand==='RVEA' && t.productLine===line);

  return `
  <div class="page active">
    <div class="page-head">
      <div>
        <div class="page-title"><span class="brand-chip rvea"><span class="dot"></span>RVEA</span> <span style="color:var(--ink-faint);font-weight:400;">/ ${line}</span></div>
        <div class="page-sub">${lineDesc(line)}</div>
      </div>
      ${viewToggleHtml()}
    </div>
    ${rveaSubtabsHtml()}

    <div class="banner info">成本 = 直接歸屬於「${line}」的支出 ＋ RVEA共同成本（含分攤到RVEA的DUMO/RVEA共用成本）依各產品線當月營收比例分攤。</div>

    <div class="card-row">
      <div class="stat-card"><div class="label">年度至今營收</div><div class="value num">${fmtTWD(ytdRev)}</div></div>
      <div class="stat-card"><div class="label">年度至今總成本</div><div class="value num">${fmtTWD(ytdCost)}</div></div>
      <div class="stat-card"><div class="label">年度至今利潤</div><div class="value num ${ytdProfit>=0?'pos':'neg'}">${fmtTWD(ytdProfit)}</div></div>
    </div>

    <div class="panel">
      <div class="panel-head"><h3>每月損益（${line}）</h3></div>
      <div class="panel-body" style="padding:0 18px 12px 18px;">
        <table class="ledger"><thead><tr><th>月份</th><th>營收</th><th>成本(含分攤)</th><th>利潤</th></tr></thead>
        <tbody>${tableRows}</tbody></table>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><h3>${line} 交易明細</h3>
        <button class="btn btn-primary btn-sm" id="btnAddTxnRveaLine" data-line="${line}">+ 新增記錄</button>
      </div>
      <div class="panel-body">${renderTxnMiniTable(lineTxns)}</div>
    </div>
  </div>`;
}
function lineDesc(line){
  if(line==='28問') return '錄製課程・進階班導流磁鐵・銀行轉帳自助購買';
  if(line==='進階班') return '穿戴甲進階班・實體小班教學（2-4人）';
  if(line==='靈感研究室') return 'SKOOL訂閱制社群';
  return '';

   Transaction Add/Edit Modal

function openTxnModal(presetOrTxn){
  const isEdit = presetOrTxn && presetOrTxn.id;
  editingTxnId = isEdit ? presetOrTxn.id : null;
  const t = isEdit ? presetOrTxn : Object.assign({
    type:'expense', date: todayStr(), brand:'DUMO', productLine:null,
    category:'商品成本', item:'', qty:'', rmb:'', twd:'', source:'', note:''
  }, presetOrTxn||{});

  document.getElementById('modalRoot').innerHTML = txnModalHtml(t);
  document.getElementById('modalBackdrop').classList.add('open');
  bindTxnModalEvents(t);
}
function closeModal(){
  document.getElementById('modalBackdrop').classList.remove('open');
  document.getElementById('modalRoot').innerHTML = '';
  editingTxnId = null; editingCashId = null;
}

          ${t.type==='expense'?`<option value="SHARED" ${t.brand==='SHARED'?'selected':''}>共同成本（自動分攤）</option>`:''}
        </select>
      </div>
    </div>

    <div class="field-row" id="rowProductLine" style="display:${t.brand==='RVEA'?'grid':'none'};">
      <div class="field full">
        <label>RVEA 產品線 ${t.type==='expense'?'（支出可留空＝RVEA共同成本）':'（收入必選）'}</label>
        <select id="tProductLine">
          ${t.type==='expense'?`<option value="" ${!t.productLine?'selected':''}>— RVEA共同（不指定產品線）—</option>`:''}
          ${PRODUCT_LINES.map(pl=>`<option value="${pl}" ${t.productLine===pl?'selected':''}>${pl}</option>`).join('')}
        </select>
      </div>
    </div>

    <div class="field-row">

        <label>類別</label>
        <select id="tCategory"></select>
      </div>
    </div>

    <div class="field-row">
      <div class="field full"><label>項目名稱</label><input type="text" id="tItem" value="${escapeHtml(t.item)}" placeholder="例如：貓眼膠 / 進階班學費 / 房租"></div>
    </div>

    <div class="field-row">
      <div class="field"><label>數量（選填）</label><input type="text" id="tQty" value="${t.qty ?? ''}"></div>
      <div class="field"><label>幣別</label>
        <select id="tCurrency">
          <option value="TWD" ${!t.rmb?'selected':''}>台幣 TWD</option>
          <option value="RMB" ${t.rmb?'selected':''}>人民幣 RMB（自動換算）</option>

    </div>

    <div class="field-row">
      <div class="field full"><label>台幣金額 ${t.rmb?'（依匯率自動計算，可手動覆蓋）':''}</label><input type="number" step="0.01" id="tTwd" value="${t.twd ?? ''}"></div>

function iconX(){ return '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>'; }

function refreshCategoryOptions(state){
  const sel = document.getElementById('tCategory');
  if(!sel) return;
  let opts = [];
  if(state.type==='expense'){
    opts = CATS.expense;
  } else {
    if(state.brand==='DUMO') opts = CATS.revenue.DUMO;
    else opts = CATS.revenue[state.productLine] || [];
  }
  sel.innerHTML = opts.map(c=>`<option value="${c}" ${state.category===c?'selected':''}>${c}</option>`).join('');
  if(!opts.includes(state.category)) state.category = opts[0]||'';
}

function bindTxnModalEvents(initial){
  const state = Object.assign({}, initial);
  if(state.brand==='SHARED') state.brand='SHARED';
  refreshCategoryOptions(state);
  document.getElementById('tCategory').value = state.category || '';

  function syncBrandRows(){
    document.getElementById('rowProductLine').style.display = (state.brand==='RVEA') ? 'grid' : 'none';
    const brandSel = document.getElementById('tBrand');
    // ensure SHARED option only present for expense
    if(state.type==='revenue'){
      const sharedOpt = brandSel.querySelector('option[value="SHARED"]');
      if(sharedOpt) sharedOpt.remove();
      if(state.brand==='SHARED'){ state.brand='DUMO'; brandSel.value='DUMO'; }
    } else {
      if(!brandSel.querySelector('option[value="SHARED"]')){
        const o = document.createElement('option'); o.value='SHARED'; o.textContent='共同成本（自動分攤）';
        brandSel.appendChild(o);
      }
    }
  }

  document.getElementById('mClose').onclick = closeModal;
  document.getElementById('mCancel').onclick = closeModal;

  document.getElementById('tTypeRev').onclick = ()=>{
    state.type='revenue';
    document.getElementById('tTypeRev').className='active rev';
    document.getElementById('tTypeExp').className='';
    syncBrandRows();
    if(state.brand==='RVEA' && !state.productLine) state.productLine = PRODUCT_LINES[0];
    refreshCategoryOptions(state);
    document.getElementById('tCategory').value = state.category;
    rerenderProductLineOptions(state);
  };
  document.getElementById('tTypeExp').onclick = ()=>{
    state.type='expense';
    document.getElementById('tTypeExp').className='active exp';
    document.getElementById('tTypeRev').className='';
    syncBrandRows();
    refreshCategoryOptions(state);
    document.getElementById('tCategory').value = state.category;
    rerenderProductLineOptions(state);
  };

  document.getElementById('tBrand').onchange = (e)=>{
    state.brand = e.target.value;
    if(state.brand!=='RVEA') state.productLine = null;
    else if(!state.productLine) state.productLine = state.type==='revenue' ? PRODUCT_LINES[0] : null;
    syncBrandRows();
    rerenderProductLineOptions(state);
    refreshCategoryOptions(state);
    document.getElementById('tCategory').value = state.category;
  };

  function rerenderProductLineOptions(state){
    const wrap = document.getElementById('rowProductLine');
    if(state.brand!=='RVEA'){ wrap.style.display='none'; return; }
    wrap.style.display='grid';
    const sel = document.getElementById('tProductLine');
    sel.innerHTML = (state.type==='expense'? `<option value="">— RVEA共同（不指定產品線）—</option>`:'') +
      PRODUCT_LINES.map(pl=>`<option value="${pl}" ${state.productLine===pl?'selected':''}>${pl}</option>`).join('');
  }

  document.getElementById('tProductLine') && (document.getElementById('tProductLine').onchange = (e)=>{
    state.productLine = e.target.value || null;
    refreshCategoryOptions(state);
    document.getElementById('tCategory').value = state.category;
  });

  document.getElementById('tCategory').onchange = (e)=>{
    state.category = e.target.value;
    if(state.type==='expense' && !editingTxnId){
      const suggested = EXP_BRAND_DEFAULT[state.category];
      if(suggested && suggested!==state.brand){
        state.brand = suggested;
        document.getElementById('tBrand').value = suggested;
        syncBrandRows(); rerenderProductLineOptions(state);
      }
    }
  };

  document.getElementById('tCurrency').onchange = (e)=>{
    document.getElementById('rowRmb').style.display = e.target.value==='RMB' ? 'grid':'none';
    recalcTwd();
  };
  function recalcTwd(){
    const cur = document.getElementById('tCurrency').value;
    if(cur==='RMB'){
      const rmb = parseFloat(document.getElementById('tRmb').value)||0;
      const fx = parseFloat(document.getElementById('tFx').value)||SETTINGS.fxRate;
      document.getElementById('tTwd').value = (rmb*fx).toFixed(2);
    }
  }
  const rmbEl = document.getElementById('tRmb'); if(rmbEl) rmbEl.oninput = recalcTwd;
  const fxEl = document.getElementById('tFx'); if(fxEl) fxEl.oninput = recalcTwd;

  document.getElementById('mSave').onclick = async ()=>{
    const type = state.type;
    const brand = document.getElementById('tBrand').value;
    const productLine = (brand==='RVEA') ? (document.getElementById('tProductLine').value || null) : null;
    const date = document.getElementById('tDate').value || todayStr();
    const category = document.getElementById('tCategory').value;
    const item = document.getElementById('tItem').value.trim();
    const qty = document.getElementById('tQty').value ? parseFloat(document.getElementById('tQty').value) : null;
    const currency = document.getElementById('tCurrency').value;
    const rmb = currency==='RMB' ? (parseFloat(document.getElementById('tRmb').value)||0) : null;
    const twd = parseFloat(document.getElementById('tTwd').value)||0;
    const source = document.getElementById('tSource').value.trim();
    const note = document.getElementById('tNote').value.trim();

    if(!item){ alert('請輸入項目名稱'); return; }
    if(type==='revenue' && brand==='RVEA' && !productLine){ alert('RVEA 收入請選擇所屬產品線（28問／進階班／靈感研究室）'); return; }
    if(!twd || twd<=0){ alert('請輸入有效的台幣金額'); return; }

    if(currency==='RMB'){
      const fx = parseFloat(document.getElementById('tFx').value)||SETTINGS.fxRate;
      SETTINGS.fxRate = fx; await saveSettings();
    }

    const record = { type, date, brand, productLine, category, item, qty, rmb, twd, source, note };

    if(editingTxnId){
      const idx = TXNS.findIndex(x=>x.id===editingTxnId);
      if(idx>=0) TXNS[idx] = Object.assign(TXNS[idx], record);
    } else {
      record.id = uid(); record.createdAt = Date.now();
      TXNS.push(record);
    }
    await saveTxns();
    closeModal();
    renderApp();
  };

  const delBtn = document.getElementById('mDelete');
  if(delBtn){
    delBtn.onclick = async ()=>{
      if(!confirm('確定要刪除這筆記錄嗎？')) return;
      TXNS = TXNS.filter(x=>x.id!==editingTxnId);
      await saveTxns();
      closeModal();
      renderApp();
    };
  }
}

async function fileToDataUrl(file){
  return new Promise((res,rej)=>{
    const r = new FileReader();
    r.onload = ()=>res(r.result);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}

// Downscale + re-encode as JPEG to keep payload small and reliable for the vision API.
async function compressImageFile(file, maxDim, quality){
  maxDim = maxDim || 1568; quality = quality || 0.85;
  const dataUrl = await fileToDataUrl(file);
  return new Promise((res)=>{
    const img = new Image();
    img.onload = ()=>{
      let { width, height } = img;
      if(width>maxDim || height>maxDim){
        if(width>height){ height = Math.round(height*maxDim/width); width = maxDim; }
        else{ width = Math.round(width*maxDim/height); height = maxDim; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0,0,width,height); // flatten transparency for PNG->JPEG
      ctx.drawImage(img, 0, 0, width, height);
      try{
        res(canvas.toDataURL('image/jpeg', quality));
      }catch(e){
        res(dataUrl); // fallback to original if canvas export fails (e.g. tainted canvas)
      }
    };
    img.onerror = ()=> res(dataUrl);
    img.src = dataUrl;
  });
}

// Shared call to the Anthropic API with a couple of retries for transient server errors.
async function callClaudeAPI(messages, maxTokens, attempts){
  attempts = attempts || 4;
  let lastErr;
  for(let i=0;i<attempts;i++){
    let resp;
    try{
      resp = await fetch("https://api.anthropic.com/v1/messages", {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({ model:"claude-sonnet-4-6", max_tokens: maxTokens||1500, messages })
      });
    }catch(networkErr){
      lastErr = new Error('連線失敗（Failed to fetch）：請求沒能送達伺服器');
      lastErr.isNetworkError = true;
      if(i<attempts-1){ await new Promise(r=>setTimeout(r, 900*(i+1))); continue; }
      throw lastErr;
    }
    let data;
    try{ data = await resp.json(); }catch(e){
      lastErr = new Error('伺服器回應無法解析，可能是暫時性問題');
      if(i<attempts-1){ await new Promise(r=>setTimeout(r, 700*(i+1))); continue; }
      throw lastErr;
    }
    if(!resp.ok || data.error){
      const msg = (data && data.error && data.error.message) ? data.error.message : `伺服器暫時發生錯誤 (${resp.status})`;
      const transient = resp.status>=500 || /internal server error|overloaded/i.test(msg);
      if(transient && i<attempts-1){ lastErr = new Error(msg); await new Promise(r=>setTimeout(r, 700*(i+1))); continue; }
      throw new Error(msg);
    }
    return data;
  }
  throw lastErr || new Error('辨識失敗，請重試');
}

function showRecognizeError(errBox, e, retryFn){
  const isNet = e && e.isNetworkError;
  const extra = isNet
    ? '這通常代表瀏覽器沒能把請求送到 Anthropic 伺服器——已自動重試了幾次仍失敗。可以先確認網路連線正常，暫時關閉廣告攔截／隱私保護類的瀏覽器擴充功能後再試一次，或換一個網路（例如關閉VPN、改用行動網路）試試看，也可能是暫時性問題，稍後再試即可。'
    : '';
  errBox.innerHTML = `<div class="banner error" style="margin-top:12px;">辨識失敗：${escapeHtml(e.message||String(e))}${extra?'<br><br>'+extra:''}</div>
    <button class="btn btn-ghost btn-sm" id="btnRetryRecognize" style="margin-top:8px;">重試一次</button>`;
  const retryBtn = document.getElementById('btnRetryRecognize');
  if(retryBtn) retryBtn.onclick = retryFn;
}

function extractJsonArray(text){
  let clean = text.trim().replace(/^```json/i,'').replace(/^```/,'').replace(/```$/,'').trim();
  try{ const p = JSON.parse(clean); return Array.isArray(p) ? p : [p]; }catch(e){}
  // fallback: find first [...] block
  const start = clean.indexOf('[');
  const end = clean.lastIndexOf(']');
  if(start>=0 && end>start){
    try{ const p = JSON.parse(clean.slice(start,end+1)); return Array.isArray(p)?p:[p]; }catch(e){}
  }
  // fallback: find first {...} block, wrap as array
  const s2 = clean.indexOf('{'); const e2 = clean.lastIndexOf('}');
  if(s2>=0 && e2>s2){
    try{ const p = JSON.parse(clean.slice(s2,e2+1)); return [p]; }catch(e){}
  }
  throw new Error('AI 回傳內容無法解析成資料，請重試一次');
}

function receiptExtractionPrompt(thisYear){
  return `你正在協助一間美甲品牌(DUMO)與教育品牌(RVEA)整理採購紀錄。使用者會上傳「各種購物/電商平台的截圖」，你需要能辨認以下各平台常見的畫面樣式：

・**蝦皮 Shopee（台灣）**：「我的訂單」列表畫面，每筆訂單上方是商店名稱（賣場名稱，通常有「進入賣場」按鈕在旁邊），中間是商品縮圖+商品名稱+規格，右下角是「總計 NT$xxx」或「小計」，訂單狀態常顯示「已完成/待評價/運送中」，日期可能顯示在訂單編號旁或需要點進訂單詳情才有，若截圖上沒有明確日期就用今天。
・**momo購物網**：畫面偏橘色，訂單編號開頭常是英數字混合，商品名稱下方會有「momo」或「momo mall」字樣，金額標示「訂單金額」。
・**淘寶 Taobao / 天貓 Tmall**：介面偏橘紅色，賣家名稱在商品上方（有時候是店鋪名稱＋「進店」），金額用人民幣¥顯示，訂單狀態如「交易成功」「待收貨」。
・**1688（阿里巴巴批發網）**：畫面也偏橘色但通常是B2B進貨/批發介面，賣家名稱常是完整公司行號（例如「XX市OO工藝品廠」「XX貿易有限公司」），常有「起批量」「規格」欄位，金額為人民幣。
・**小紅書 RED**：介面偏白/紅色，商品筆記/店鋪頁面，賣家可能是個人化暱稱（例如「花校長」「Reta」），金額人民幣。
・**抖音 / 抖音電商**：黑底或白底介面，商品卡片式排列，賣家為店鋪或達人名稱。
・**拼多多 PDD**：介面偏亮橘/黃色，常有「多多錢包」「已拼成功」字樣。
・**Line購物 / Line Pay**：綠色系介面，交易紀錄列表。
・**銀行 / 綠界(ECPay) / Square 後台**：表格式多筆交易列表，含日期、金額、狀態欄位。
・**實體發票／收據**：手機拍的紙本統一發票或收據照片，含店家名稱、日期、品項或總金額、有時有統一編號。

使用者上傳的截圖可能是「單筆收據」，也可能是「一次顯示很多筆歷史訂單的列表頁」。請仔細辨認圖片中的平台名稱、每一筆的賣家/商家名稱、日期、金額。如果畫面上同時有好幾筆不同的商品或訂單，請每一筆都各自列成一個陣列元素，不要合併加總或只抓第一筆；如果整張圖其實是同一筆訂單的不同商品（同一個賣家、同一個總金額），才合併成一筆並把商品名稱用頓號連接。

請只回傳一個 JSON 陣列(array)，不要有任何其他文字、不要用 markdown code block 包住，也不要在陣列前後加任何說明文字。每個元素格式：
{
  "date": "YYYY-MM-DD",   // 訂單日期；圖片只顯示月/日就補上西元年份${thisYear}；完全看不出來就用今天 ${todayStr()}
  "type": "expense",      // 訂單/購物紀錄幾乎都是 expense，除非明顯是收款紀錄才用 revenue
  "item": "商品名稱（不要包含賣家名稱、不要包含訂單編號）",
  "qty": 數字或null,
  "currency": "TWD" or "RMB",
  "amount": 數字,          // 該筆實付金額，對應 currency（用截圖上「總計/實付/訂單金額」，不是原價）
  "source": "平台-賣家名稱，例如：蝦皮-好好美甲材料行、1688-東莞市興悅環保包裝、小紅書-花校長、momo-OO嚴選、實體店-九大文具店",
  "suggestedCategory": "從這些類別中選一個最符合的：商品成本, 行銷拍攝成本, 空間成本, 課程成本, 固定成本, 學習成本, 物流, 其他",
  "suggestedBrand": "DUMO 或 RVEA 或 SHARED",
  "note": ""
}
分類參考：美甲材料/耗材等商品成本通常屬於DUMO；課程相關教材/教具屬於RVEA課程成本；房租、水電、軟體訂閱等固定成本、空間佈置、辦公文具、行銷拍攝設備通常是SHARED(兩品牌共用)；運費/關稅/集運屬於物流，通常屬於DUMO。若圖片某個欄位真的完全看不出來，用你最合理的推測填入，絕對不要留白或省略欄位，也絕對不要在JSON以外加任何文字。`;
}

function mapParsedToDraft(parsed){
  const twd = parsed.currency==='RMB' ? (parseFloat(parsed.amount)||0) * SETTINGS.fxRate : (parseFloat(parsed.amount)||0);
  const suggestedBrand = ['DUMO','RVEA','SHARED'].includes(parsed.suggestedBrand) ? parsed.suggestedBrand : (EXP_BRAND_DEFAULT[parsed.suggestedCategory]||'DUMO');
  const type = parsed.type==='revenue' ? 'revenue':'expense';
  let brand = suggestedBrand;
  if(type==='revenue' && brand==='SHARED') brand = 'DUMO';
  let productLine = null;
  if(brand==='RVEA' && type==='revenue') productLine = PRODUCT_LINES[0];
  let category = CATS.expense.includes(parsed.suggestedCategory) ? parsed.suggestedCategory : (type==='expense' ? '其他' : (brand==='DUMO'?CATS.revenue.DUMO[0]:CATS.revenue[productLine][0]));
  return {
    type,
    date: /^\d{4}-\d{2}-\d{2}$/.test(parsed.date) ? parsed.date : todayStr(),
    brand, productLine,
    category,
    item: parsed.item || '未命名項目',
    qty: parsed.qty || null,
    twd: Math.round(twd*100)/100,
    source: parsed.source || '',
    note: parsed.note || (parsed.currency==='RMB' ? `原始金額 ¥${parsed.amount}（依匯率 ${SETTINGS.fxRate} 換算）` : ''),
    include: true
  };
}

async function recognizeReceipt(){
  const btn = document.getElementById('btnRecognize');
  const spin = document.getElementById('recognizeSpin');
  const errBox = document.getElementById('recognizeError');
  errBox.innerHTML = '';
  btn.disabled = true;
  spin.innerHTML = '<span class="spinner"></span>';
  try{
    const match = receiptImageData.match(/^data:(image\/[a-zA-Z]+);base64,(.*)$/);
    if(!match) throw new Error('圖片格式錯誤');
    const mediaType = match[1];
    const base64 = match[2];
    const thisYear = todayStr().slice(0,4);
    const prompt = receiptExtractionPrompt(thisYear);

    const data = await callClaudeAPI([{
      role:"user",
      content:[
        { type:"image", source:{ type:"base64", media_type: mediaType, data: base64 } },
        { type:"text", text: prompt }
      ]
    }], 4000, 3);
    const textBlocks = (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n');
    if(!textBlocks) throw new Error('AI 沒有回傳可讀取的文字內容');
    const items = extractJsonArray(textBlocks);
    if(!items.length) throw new Error('沒有辨識出任何項目，請換一張更清楚的截圖');

    receiptDrafts = items.map(mapParsedToDraft);
    document.getElementById('receiptReviewPanel').innerHTML = renderReceiptReviewTable();
    bindReceiptReviewEvents();
  }catch(e){
    console.error(e);
    errBox.innerHTML = '';
    showRecognizeError(errBox, e, recognizeReceipt);
  }finally{
    btn.disabled = false;
    spin.innerHTML = '';
  }
}

function bindReceiptReviewEvents(){
  const panel = document.getElementById('receiptReviewPanel');
  if(!panel) return;

  function rerenderTable(){
    panel.innerHTML = renderReceiptReviewTable();
    bindReceiptReviewEvents();
  }

  panel.querySelectorAll('.rInclude').forEach(el=>{
    el.onchange = ()=>{ receiptDrafts[el.dataset.idx].include = el.checked;
      const sumEl = panel.querySelector('.num'); if(sumEl){ /* recompute footer only */ }
      rerenderTable();
    };
  });
  panel.querySelectorAll('.rDate').forEach(el=>{ el.onchange = ()=>{ receiptDrafts[el.dataset.idx].date = el.value; }; });
  panel.querySelectorAll('.rItem').forEach(el=>{ el.oninput = ()=>{ receiptDrafts[el.dataset.idx].item = el.value; }; });
  panel.querySelectorAll('.rQty').forEach(el=>{ el.oninput = ()=>{ receiptDrafts[el.dataset.idx].qty = el.value; }; });
  panel.querySelectorAll('.rTwd').forEach(el=>{ el.oninput = ()=>{ receiptDrafts[el.dataset.idx].twd = el.value; }; });
  panel.querySelectorAll('.rSource').forEach(el=>{ el.oninput = ()=>{ receiptDrafts[el.dataset.idx].source = el.value; }; });

  panel.querySelectorAll('.rType').forEach(el=>{
    el.onchange = ()=>{
      const d = receiptDrafts[el.dataset.idx];
      d.type = el.value;
      if(d.type==='revenue' && d.brand==='SHARED') d.brand='DUMO';
      if(d.type==='revenue' && d.brand==='RVEA' && !d.productLine) d.productLine = PRODUCT_LINES[0];
      const opts = d.type==='expense' ? CATS.expense : (d.brand==='DUMO'?CATS.revenue.DUMO:(CATS.revenue[d.productLine]||[]));
      if(!opts.includes(d.category)) d.category = opts[0]||'';
      rerenderTable();
    };
  });
  panel.querySelectorAll('.rBrand').forEach(el=>{
    el.onchange = ()=>{
      const d = receiptDrafts[el.dataset.idx];
      d.brand = el.value;
      if(d.brand!=='RVEA') d.productLine = null;
      else if(!d.productLine) d.productLine = d.type==='revenue' ? PRODUCT_LINES[0] : null;
      const opts = d.type==='expense' ? CATS.expense : (d.brand==='DUMO'?CATS.revenue.DUMO:(CATS.revenue[d.productLine]||[]));
      if(!opts.includes(d.category)) d.category = opts[0]||'';
      rerenderTable();
    };
  });
  panel.querySelectorAll('.rProductLine').forEach(el=>{
    el.onchange = ()=>{
      const d = receiptDrafts[el.dataset.idx];
      d.productLine = el.value || null;
      const opts = d.type==='expense' ? CATS.expense : (CATS.revenue[d.productLine]||[]);
      if(!opts.includes(d.category)) d.category = opts[0]||'';
      rerenderTable();
    };
  });
  panel.querySelectorAll('.rCategory').forEach(el=>{ el.onchange = ()=>{ receiptDrafts[el.dataset.idx].category = el.value; }; });
  panel.querySelectorAll('.rDelRow').forEach(el=>{
    el.onclick = ()=>{ receiptDrafts.splice(parseInt(el.dataset.idx,10),1); rerenderTable(); };
  });

  const addRowBtn = document.getElementById('rAddRow');
  if(addRowBtn) addRowBtn.onclick = ()=>{ receiptDrafts.push(blankDraftRow()); rerenderTable(); };

  const cancelAll = document.getElementById('rCancelAll');
  if(cancelAll) cancelAll.onclick = ()=>{ receiptDrafts = null; panel.innerHTML=''; };

  const saveAll = document.getElementById('rSaveAll');
  if(saveAll) saveAll.onclick = async ()=>{
    const toSave = receiptDrafts.filter(d=>d.include);
    if(toSave.length===0){ alert('請至少勾選一筆要記帳的項目'); return; }
    const invalid = toSave.find(d=> !d.item || !d.twd || parseFloat(d.twd)<=0 || (d.brand==='RVEA' && d.type==='revenue' && !d.productLine));
    if(invalid){ alert('有勾選的項目缺少項目名稱、有效金額，或RVEA收入未選產品線，請檢查後再儲存'); return; }
    toSave.forEach(d=>{
      TXNS.push({
        id: uid(), createdAt: Date.now(),
        type: d.type, date: d.date || todayStr(), brand: d.brand, productLine: d.productLine,
        category: d.category, item: d.item.trim(), qty: d.qty? parseFloat(d.qty): null,
        rmb: null, twd: parseFloat(d.twd)||0, source: (d.source||'').trim(), note: (d.note||'').trim()
      });
    });
    await saveTxns();
    receiptDrafts = null;
    receiptImageData = null;
    renderApp();
  };
}

/* ============================================================
   Voice input page (語音輸入 — 語音辨識自動記帳)
   ============================================================ */
let voiceRecognition = null;
let voiceRecognizing = false;

function renderVoicePage(){
  return `
  <div class="page active">
    <div class="page-head">
      <div>
        <div class="page-title">語音輸入</div>
        <div class="page-sub">用說的記帳，例如：「圓珠筆25塊，九大文具店買的，工作室空間成本」，AI 會自動拆解成記帳欄位</div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-body">
        <div id="voiceUnsupported" style="display:none;" class="banner warn">這個瀏覽器不支援語音辨識（建議用 Chrome 或 Edge）。您可以直接在下方欄位打字，一樣可以按「AI 辨識並記帳」自動拆解。</div>
        <div style="display:flex; align-items:center; gap:14px; margin-bottom:16px;">
          <button class="btn" id="btnMic" style="background:var(--navy); border-radius:999px; width:56px; height:56px; padding:0; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4"/></svg>
          </button>
          <div id="micStatus" style="font-size:13px; color:var(--ink-soft);">點麥克風開始說話</div>
        </div>
        <div class="field full">
          <label>語音轉文字內容（可直接編輯修正錯字後再送出）</label>
          <textarea id="voiceTranscript" rows="3" placeholder="例如：圓珠筆25塊，九大文具店買的，工作室空間成本" style="border:1px solid var(--line-strong); border-radius:var(--radius-sm); padding:10px; resize:vertical;"></textarea>
        </div>
        <div style="margin-top:12px;">
          <button class="btn btn-primary" id="btnVoiceRecognize"><span id="voiceSpin"></span>AI 辨識並記帳</button>
        </div>
        <div id="voiceError"></div>
      </div>
    </div>

    <div id="receiptReviewPanel"></div>
  </div>`;
}

async function recognizeVoiceText(){
  const btn = document.getElementById('btnVoiceRecognize');
  const spin = document.getElementById('voiceSpin');
  const errBox = document.getElementById('voiceError');
  const text = (document.getElementById('voiceTranscript').value||'').trim();
  errBox.innerHTML = '';
  if(!text){ errBox.innerHTML = '<div class="banner warn" style="margin-top:10px;">請先錄音，或直接在欄位裡打字描述這筆帳目</div>'; return; }
  btn.disabled = true;
  spin.innerHTML = '<span class="spinner"></span>';
  try{
    const prompt = `你正在協助一間美甲品牌(DUMO)與教育品牌(RVEA)記帳。使用者用語音口述了一筆或多筆採購/收入紀錄，逐字稿如下（語音辨識可能有同音字錯誤或口語贅字，請合理推斷語意，不要照字面死板解讀）：
"""${text}"""

請把每一筆花費/收入拆解成一筆記帳資料，只回傳一個 JSON 陣列(array)，不要有其他文字、不要用markdown code block包住。每個元素格式：
{
  "date": "YYYY-MM-DD", // 使用者若沒說日期就用今天 ${todayStr()}；若說「今天/昨天/前天」請據此推算(今天是${todayStr()})
  "type": "expense" or "revenue",
  "item": "品項名稱",
  "qty": 數字或null,
  "currency": "TWD" or "RMB",
  "amount": 數字,
  "source": "使用者提到的商家/平台名稱，沒提到就用空字串",
  "suggestedCategory": "從這些類別中選一個最符合的：商品成本, 行銷拍攝成本, 空間成本, 課程成本, 固定成本, 學習成本, 物流, 其他",
  "suggestedBrand": "DUMO 或 RVEA 或 SHARED，使用者說「工作室」「共用」等通常是SHARED",
  "note": ""
}
若使用者口述中已經明確講出類別（例如「空間成本」「課程成本」）或品牌，請直接採用使用者說的分類，不要自己改判斷。`;

    const data = await callClaudeAPI([{ role:"user", content: prompt }], 2000, 3);
    const textBlocks = (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n');
    if(!textBlocks) throw new Error('AI 沒有回傳可讀取的文字內容');
    const items = extractJsonArray(textBlocks);
    if(!items.length) throw new Error('沒有辨識出任何項目，請再說一次或補充更多細節');

    receiptDrafts = items.map(mapParsedToDraft);
    document.getElementById('receiptReviewPanel').innerHTML = renderReceiptReviewTable();
    bindReceiptReviewEvents();
  }catch(e){
    console.error(e);
    errBox.innerHTML = '';
    showRecognizeError(errBox, e, recognizeVoiceText);
  }finally{
    btn.disabled = false;
    spin.innerHTML = '';
  }
}

/* ============================================================
   Cash reconciliation page (出金對帳 — 實際收到的錢)
   ============================================================ */
function renderCashPage(){
  let list = CASHLOGS.slice();
  if(CASH_FILTERS.brand!=='ALL') list = list.filter(c=>c.brand===CASH_FILTERS.brand);
  if(CASH_FILTERS.month!=='ALL') list = list.filter(c=>monthKey(c.date)===currentYear()+'-'+CASH_FILTERS.month);
  list.sort((a,b)=>b.date.localeCompare(a.date));
  const total = list.reduce((s,c)=>s+c.amountTWD,0);

  const rows = list.map(c=>`
    <tr>
      <td style="text-align:left">${c.date}</td>
      <td style="text-align:left">${brandChip(c.brand)}${c.productLine?` <span style="font-size:11px;color:var(--ink-faint)">${c.productLine}</span>`:''}</td>
      <td style="text-align:left">${escapeHtml(c.channel)}</td>
      <td class="num">${fmtTWD(c.amountTWD)}</td>
      <td style="text-align:left">${escapeHtml(c.note||'')}</td>
      <td style="text-align:center;white-space:nowrap;">
        <button class="icon-btn edit-cash" data-id="${c.id}" title="編輯">${iconEdit()}</button>
        <button class="icon-btn del-cash" data-id="${c.id}" title="刪除">${iconTrash()}</button>
      </td>
    </tr>`).join('');

  // monthly summary by brand
  const summaryRows = yearMonths().map((m,i)=>{
    const dumo = CASHLOGS.filter(c=>monthKey(c.date)===m && c.brand==='DUMO').reduce((s,c)=>s+c.amountTWD,0);
    const rvea = CASHLOGS.filter(c=>monthKey(c.date)===m && c.brand==='RVEA').reduce((s,c)=>s+c.amountTWD,0);
    if(dumo===0 && rvea===0) return `<tr style="opacity:.4"><td>${MONTH_LABEL[i]}</td><td class="num">–</td><td class="num">–</td><td class="num">–</td></tr>`;
    return `<tr><td>${MONTH_LABEL[i]}</td><td class="num">${fmtTWD(dumo)}</td><td class="num">${fmtTWD(rvea)}</td><td class="num" style="font-weight:700">${fmtTWD(dumo+rvea)}</td></tr>`;
  }).join('');

  return `
  <div class="page active">
    <div class="page-head">
      <div>
        <div class="page-title">出金對帳</div>
        <div class="page-sub">登錄綠界／Square／銀行實際入帳金額，作為「實際收到的錢」的依據</div>
      </div>
      <button class="btn btn-primary" id="btnAddCash">+ 新增入帳紀錄</button>
    </div>

    <div class="banner info">此頁登錄的金額只影響「實收版」總覽；帳面版仍依訂單成立日期計算，兩者不會互相覆蓋。</div>

    <div class="panel">
      <div class="panel-head"><h3>每月實收金額（依品牌）</h3></div>
      <div class="panel-body" style="padding:0 18px 12px 18px;">
        <table class="ledger"><thead><tr><th>月份</th><th>DUMO</th><th>RVEA</th><th>合計</th></tr></thead>
        <tbody>${summaryRows}</tbody></table>
      </div>
    </div>

    <div class="toolbar">
      <select id="cfBrand">
        <option value="ALL">全部品牌</option>
        <option value="DUMO" ${CASH_FILTERS.brand==='DUMO'?'selected':''}>DUMO</option>
        <option value="RVEA" ${CASH_FILTERS.brand==='RVEA'?'selected':''}>RVEA</option>
      </select>
      <select id="cfMonth">
        <option value="ALL">全部月份</option>
        ${MONTHS.map((m,i)=>`<option value="${m}" ${CASH_FILTERS.month===m?'selected':''}>${MONTH_LABEL[i]}</option>`).join('')}
      </select>
      <div class="spacer"></div>
      <div style="font-size:12.5px;color:var(--ink-soft);">篩選小計：<span class="num" style="font-weight:700;">${fmtTWD(total)}</span></div>
    </div>

    <div class="panel">
      <div class="panel-body" style="padding:0;">
        <table class="ledger">
          <thead><tr><th>入帳日期</th><th>品牌</th><th>通路</th><th>金額(TWD)</th><th>備註</th><th>操作</th></tr></thead>
          <tbody>${rows || '<tr><td colspan="6" class="empty">尚無入帳紀錄，點右上角新增</td></tr>'}</tbody>
        </table>
      </div>
    </div>
  </div>`;
}

function openCashModal(existing){
  const isEdit = existing && existing.id;
  editingCashId = isEdit ? existing.id : null;
  const c = existing || { date: todayStr(), brand:'DUMO', productLine:null, channel:'綠界', amountTWD:'', note:'' };
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-head"><h3>${isEdit?'編輯入帳紀錄':'新增入帳紀錄'}</h3><button class="icon-btn" id="mClose">${iconX()}</button></div>
    <div class="modal-body">
      <div class="field-row">
        <div class="field"><label>入帳日期</label><input type="date" id="cDate" value="${c.date}"></div>
        <div class="field"><label>品牌</label>
          <select id="cBrand">
            <option value="DUMO" ${c.brand==='DUMO'?'selected':''}>DUMO</option>
            <option value="RVEA" ${c.brand==='RVEA'?'selected':''}>RVEA</option>
          </select>
        </div>
      </div>
      <div class="field-row" id="cRowPL" style="display:${c.brand==='RVEA'?'grid':'none'};">
        <div class="field full"><label>產品線（選填）</label>
          <select id="cProductLine">
            <option value="">— 不指定 —</option>
            ${PRODUCT_LINES.map(pl=>`<option value="${pl}" ${c.productLine===pl?'selected':''}>${pl}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="field-row">
        <div class="field"><label>通路</label>
          <select id="cChannel">${CHANNELS.map(ch=>`<option value="${ch}" ${c.channel===ch?'selected':''}>${ch}</option>`).join('')}</select>
        </div>
        <div class="field"><label>金額(TWD)</label><input type="number" step="0.01" id="cAmount" value="${c.amountTWD}"></div>
      </div>
      <div class="field-row"><div class="field full"><label>備註（選填）</label><input type="text" id="cNote" value="${escapeHtml(c.note||'')}"></div></div>
    </div>
    <div class="modal-foot">
      ${isEdit?'<button class="btn btn-danger" id="mDeleteCash" style="margin-right:auto;">刪除</button>':''}
      <button class="btn btn-ghost" id="mCancel">取消</button>
      <button class="btn btn-primary" id="mSaveCash">儲存</button>
    </div>`;
  document.getElementById('modalBackdrop').classList.add('open');
  document.getElementById('mClose').onclick = closeModal;
  document.getElementById('mCancel').onclick = closeModal;
  document.getElementById('cBrand').onchange = (e)=>{
    document.getElementById('cRowPL').style.display = e.target.value==='RVEA' ? 'grid':'none';
  };
  document.getElementById('mSaveCash').onclick = async ()=>{
    const record = {
      date: document.getElementById('cDate').value || todayStr(),
      brand: document.getElementById('cBrand').value,
      productLine: document.getElementById('cBrand').value==='RVEA' ? (document.getElementById('cProductLine').value||null) : null,
      channel: document.getElementById('cChannel').value,
      amountTWD: parseFloat(document.getElementById('cAmount').value)||0,
      note: document.getElementById('cNote').value.trim()
    };
    if(!record.amountTWD || record.amountTWD<=0){ alert('請輸入有效金額'); return; }
    if(editingCashId){
      const idx = CASHLOGS.findIndex(x=>x.id===editingCashId);
      if(idx>=0) CASHLOGS[idx] = Object.assign(CASHLOGS[idx], record);
    } else {
      record.id = uid();
      CASHLOGS.push(record);
    }
    await saveCashlogs();
    closeModal();
    renderApp();
  };
  const delBtn = document.getElementById('mDeleteCash');
  if(delBtn) delBtn.onclick = async ()=>{
    if(!confirm('確定要刪除這筆入帳紀錄嗎？')) return;
    CASHLOGS = CASHLOGS.filter(x=>x.id!==editingCashId);
    await saveCashlogs();
    closeModal();
    renderApp();
  };
}

/* ============================================================
   Page-level event binding (delegated per render)
   ============================================================ */
function attachPageHandlers(){
  // view toggle
  const vt = document.getElementById('viewToggle');
  if(vt) vt.querySelectorAll('button').forEach(b=>{
    b.onclick = ()=>{ VIEW_MODE = b.dataset.mode; renderApp(); };
  });

  // rvea subtabs
  const st = document.getElementById('rveaSubtabs');
  if(st) st.querySelectorAll('button').forEach(b=>{
    b.onclick = ()=>{ RVEA_SUBTAB = b.dataset.tab; renderApp(); };
  });

  // add txn buttons
  const btnAdd = document.getElementById('btnAddTxn');
  if(btnAdd) btnAdd.onclick = ()=>openTxnModal();
  const btnAddBrand = document.getElementById('btnAddTxnBrand');
  if(btnAddBrand) btnAddBrand.onclick = ()=>openTxnModal({type:'expense', brand: btnAddBrand.dataset.brand, date: todayStr()});
  const btnAddLine = document.getElementById('btnAddTxnRveaLine');
  if(btnAddLine) btnAddLine.onclick = ()=>openTxnModal({type:'revenue', brand:'RVEA', productLine: btnAddLine.dataset.line, date: todayStr()});

  // edit/delete txn (delegated across whole main since could be in mini tables)
  document.querySelectorAll('.edit-txn').forEach(el=>{
    el.onclick = ()=>{ const t = TXNS.find(x=>x.id===el.dataset.id); if(t) openTxnModal(t); };
  });
  document.querySelectorAll('.del-txn').forEach(el=>{
    el.onclick = async ()=>{
      if(!confirm('確定要刪除這筆記錄嗎？')) return;
      TXNS = TXNS.filter(x=>x.id!==el.dataset.id);
      await saveTxns();
      renderApp();
    };
  });

  // ledger filters
  ['fBrand','fType','fMonth','fCategory'].forEach(id=>{
    const el = document.getElementById(id);
    if(el) el.onchange = ()=>{
      LEDGER_FILTERS.brand = document.getElementById('fBrand').value;
      LEDGER_FILTERS.type = document.getElementById('fType').value;
      LEDGER_FILTERS.month = document.getElementById('fMonth').value;
      LEDGER_FILTERS.category = document.getElementById('fCategory').value;
      renderApp();
    };
  });
  const fq = document.getElementById('fQ');
  if(fq) fq.oninput = ()=>{ LEDGER_FILTERS.q = fq.value; document.getElementById('main').innerHTML = renderLedgerPage(); attachPageHandlers(); };

  // cash filters
  ['cfBrand','cfMonth'].forEach(id=>{
    const el = document.getElementById(id);
    if(el) el.onchange = ()=>{
      CASH_FILTERS.brand = document.getElementById('cfBrand').value;
      CASH_FILTERS.month = document.getElementById('cfMonth').value;
      renderApp();
    };
  });
  const btnAddCash = document.getElementById('btnAddCash');
  if(btnAddCash) btnAddCash.onclick = ()=>openCashModal();
  document.querySelectorAll('.edit-cash').forEach(el=>{
    el.onclick = ()=>{ const c = CASHLOGS.find(x=>x.id===el.dataset.id); if(c) openCashModal(c); };
  });
  document.querySelectorAll('.del-cash').forEach(el=>{
    el.onclick = async ()=>{
      if(!confirm('確定要刪除這筆入帳紀錄嗎？')) return;
      CASHLOGS = CASHLOGS.filter(x=>x.id!==el.dataset.id);
      await saveCashlogs();
      renderApp();
    };
  });

  // receipt page
  const dz = document.getElementById('dropzone');
  const fileInput = document.getElementById('fileInput');
  if(dz) dz.onclick = ()=>fileInput.click();
  if(fileInput) fileInput.onchange = async ()=>{
    const f = fileInput.files[0];
    if(!f) return;
    try{
      receiptImageData = await compressImageFile(f, 1568, 0.85);
    }catch(e){
      receiptImageData = await fileToDataUrl(f);
    }
    receiptDrafts = null;
    renderApp();
  };
  const btnClearImg = document.getElementById('btnClearImg');
  if(btnClearImg) btnClearImg.onclick = ()=>{ receiptImageData = null; receiptDrafts = null; renderApp(); };
  const btnRecognize = document.getElementById('btnRecognize');
  if(btnRecognize) btnRecognize.onclick = recognizeReceipt;

  // voice page
  const btnMic = document.getElementById('btnMic');
  if(btnMic){
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!SR){
      const unsupported = document.getElementById('voiceUnsupported');
      if(unsupported) unsupported.style.display = 'block';
      btnMic.disabled = true;
      btnMic.style.opacity = '0.4';
    } else {
      btnMic.onclick = ()=>{
        if(voiceRecognizing){
          if(voiceRecognition) voiceRecognition.stop();
          return;
        }
        voiceRecognition = new SR();
        voiceRecognition.lang = 'zh-TW';
        voiceRecognition.interimResults = true;
        voiceRecognition.continuous = true;
        voiceRecognizing = true;
        const statusEl = document.getElementById('micStatus');
        if(statusEl) statusEl.textContent = '聆聽中…請開始說話（再按一次麥克風結束）';
        btnMic.style.background = 'var(--dumo)';
        voiceRecognition.onresult = (e)=>{
          let transcript = '';
          for(let i=0;i<e.results.length;i++){ transcript += e.results[i][0].transcript; }
          const ta = document.getElementById('voiceTranscript');
          if(ta) ta.value = transcript;
        };
        voiceRecognition.onerror = (e)=>{
          const statusEl2 = document.getElementById('micStatus');
          if(statusEl2) statusEl2.textContent = '語音辨識發生錯誤：' + e.error + '（可直接用打字輸入）';
        };
        voiceRecognition.onend = ()=>{
          voiceRecognizing = false;
          btnMic.style.background = 'var(--navy)';
          const statusEl3 = document.getElementById('micStatus');
          if(statusEl3) statusEl3.textContent = '點麥克風開始說話';
        };
        try{ voiceRecognition.start(); }catch(e){ voiceRecognizing = false; }
      };
    }
  }
  const btnVoiceRecognize = document.getElementById('btnVoiceRecognize');
  if(btnVoiceRecognize) btnVoiceRecognize.onclick = recognizeVoiceText;

  // modal backdrop click to close
  const backdrop = document.getElementById('modalBackdrop');
  backdrop.onclick = (e)=>{ if(e.target===backdrop) closeModal(); };
}

/* ============================================================
   Init
   ============================================================ */
(async function init(){
  bindDrawerControls();
  bindBackupControls();
  await loadData();
  updateStorageModeLine();
  if(!STORAGE_OK) showStorageWarning();
  renderApp();
})();

function updateStorageModeLine(){
  const el = document.getElementById('storageModeLine');
  if(!el) return;
  if(STORAGE_MODE==='sheet') el.textContent = STORAGE_OK ? '✅ 已連接 Google 試算表（可離線於Claude外使用）' : '⚠️ Google試算表連線失敗';
  else if(STORAGE_MODE==='claude-storage') el.textContent = STORAGE_OK ? '✅ Claude 雲端儲存中（僅限對話內開啟時有效）' : '⚠️ Claude 雲端儲存失敗';
  else el.textContent = '⚠️ 目前沒有連接任何儲存空間，資料只留在這次畫面';
}
